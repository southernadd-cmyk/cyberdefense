<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Secure Comms Network</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Network matrix panel -->
  <rect x="6" y="8" width="20" height="18" fill="url(#panel)" stroke="#2a313c" stroke-width="1"/>

  <!-- Communication grid -->
  <path d="M16 9V25M9 16H23" stroke="#57d9ff" stroke-width="1"/>
  <path d="M10 10H22M10 22H22M10 10V22M22 10V22" stroke="#57d9ff" stroke-width="1" stroke-opacity="0.55"/>

  <!-- Network nodes -->
  <rect x="8" y="8" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="22" y="8" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="8" y="24" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="22" y="24" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>

  <!-- Central secure comms core -->
  <rect x="13" y="13" width="6" height="6" fill="#0a0d12" stroke="#ff355e" stroke-width="1"/>
  <path d="M15 13V12C15 11 15.8 10 16 10C16.2 10 17 11 17 12V13" stroke="#ff355e" stroke-width="1"/>
  <path d="M14 16H18" stroke="#42f58d" stroke-width="1"/>

  <!-- Signal links -->
  <path d="M10 9L13 13M23 9L19 13M10 25L13 19M23 25L19 19" stroke="#42f58d" stroke-width="1" stroke-opacity="0.8"/>

  <!-- Packet indicators -->
  <rect x="12" y="12" width="1" height="1" fill="#42f58d"/>
  <rect x="19" y="12" width="1" height="1" fill="#42f58d"/>
  <rect x="12" y="19" width="1" height="1" fill="#57d9ff"/>
  <rect x="19" y="19" width="1" height="1" fill="#57d9ff"/>

  <!-- Alert strip -->
  <rect x="12" y="23" width="8" height="1" fill="#ff355e" fill-opacity="0.45"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="7" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="26" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
