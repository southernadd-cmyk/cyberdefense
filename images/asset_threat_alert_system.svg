<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Threat Alert System</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Alert console panel -->
  <rect x="6" y="8" width="20" height="18" fill="url(#panel)" stroke="#2a313c" stroke-width="1"/>

  <!-- Warning triangle (primary threat symbol) -->
  <path d="M16 10L23 22H9L16 10Z" fill="#1a0d12" stroke="#ff355e" stroke-width="1"/>

  <!-- Exclamation mark -->
  <rect x="15.5" y="14" width="1" height="4" fill="#ff355e"/>
  <rect x="15.5" y="19" width="1" height="1" fill="#ff355e"/>

  <!-- Pulse scan lines -->
  <path d="M8 12H11M21 12H24M8 20H12M20 20H24" stroke="#57d9ff" stroke-width="1" stroke-opacity="0.7"/>

  <!-- Side threat nodes -->
  <rect x="7" y="15" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="23" y="15" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <path d="M9 16H11M21 16H23" stroke="#42f58d" stroke-width="1"/>

  <!-- Alert ticker strip -->
  <rect x="8" y="24" width="16" height="1" fill="#ff355e" fill-opacity="0.5"/>
  <path d="M9 24.5H14M16 24.5H22" stroke="#57d9ff" stroke-width="1" stroke-opacity="0.75"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="7" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="26" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
