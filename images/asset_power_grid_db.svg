<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Power Grid DB</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57d9ff"/>
      <stop offset="1" stop-color="#42f58d"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Power bolt (grid energy) -->
  <path d="M16 7L20 14L16 12L12 14L16 7Z" fill="#0b0f14" stroke="#57d9ff" stroke-width="1"/>
  <path d="M16 8L19 13L16 12L13 13L16 8Z" fill="url(#bolt)" fill-opacity="0.8"/>

  <!-- Grid transmission links -->
  <path d="M8 16L12 24L16 20L20 24L24 16" stroke="#42f58d" stroke-width="1"/>
  <rect x="7" y="15" width="2" height="2" fill="#0b0f14" stroke="#57d9ff" stroke-width="1"/>
  <rect x="23" y="15" width="2" height="2" fill="#0b0f14" stroke="#57d9ff" stroke-width="1"/>

  <!-- Database cylinder -->
  <ellipse cx="16" cy="26" rx="6" ry="2" fill="#0a0d12" stroke="#57d9ff" stroke-width="1"/>
  <path d="M10 26V27C10 28 12.7 29 16 29C19.3 29 22 28 22 27V26" fill="url(#db)" stroke="#57d9ff" stroke-width="1"/>

  <!-- DB activity indicators -->
  <path d="M13 26H19" stroke="#42f58d" stroke-width="1"/>
  <rect x="15" y="25" width="2" height="1" fill="#ff355e"/>

  <!-- Security lock badge -->
  <rect x="22" y="22" width="4" height="4" fill="#11161d" stroke="#ff355e" stroke-width="1"/>
  <path d="M23 22V21C23 20 23.8 19 24 19C24.2 19 25 20 25 21V22" stroke="#ff355e" stroke-width="1"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="8" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="24" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
