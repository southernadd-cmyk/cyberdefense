<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>SQL Injection</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Vulnerable input form -->
  <rect x="6" y="8" width="11" height="9" fill="url(#panel)" stroke="#2a313c" stroke-width="1"/>
  <rect x="7" y="10" width="9" height="2" fill="#05070b" stroke="#242c35" stroke-width="1"/>
  <path d="M8 11H14" stroke="#57d9ff" stroke-width="1"/>
  <rect x="7" y="13" width="7" height="1" fill="#0b0f14"/>
  <path d="M8 13H12" stroke="#42f58d" stroke-width="1"/>

  <!-- Injected payload marker -->
  <rect x="9" y="15" width="6" height="2" fill="#1a0d12" stroke="#ff355e" stroke-width="1"/>
  <path d="M10 16H14" stroke="#ff355e" stroke-width="1"/>

  <!-- SQLi needle / injector -->
  <path d="M16 12L20 12" stroke="#ff355e" stroke-width="1"/>
  <path d="M20 11L22 12L20 13" stroke="#ff355e" stroke-width="1"/>
  <rect x="15" y="11" width="1" height="2" fill="#57d9ff"/>

  <!-- Target database -->
  <ellipse cx="22" cy="17" rx="5" ry="2" fill="#0a0d12" stroke="#57d9ff" stroke-width="1"/>
  <path d="M17 17V23C17 24.4 19.2 25.5 22 25.5C24.8 25.5 27 24.4 27 23V17" fill="url(#db)" stroke="#57d9ff" stroke-width="1"/>
  <path d="M17 20C17 21.4 19.2 22.5 22 22.5C24.8 22.5 27 21.4 27 20" stroke="#42f58d" stroke-width="1"/>

  <!-- Broken query shield -->
  <rect x="20" y="18" width="4" height="4" fill="#11161d" stroke="#ff355e" stroke-width="1"/>
  <path d="M20 18L24 22M24 18L20 22" stroke="#ff355e" stroke-width="1"/>

  <!-- Malicious query text strip -->
  <rect x="6" y="24" width="16" height="2" fill="#0b0f14" stroke="#2a313c" stroke-width="1"/>
  <path d="M7 25H8M10 25H11M13 25H14M16 25H17M19 25H20" stroke="#57d9ff" stroke-width="1"/>
  <rect x="21" y="24" width="5" height="2" fill="#1a0d12" stroke="#ff355e" stroke-width="1"/>

  <!-- Exfil / bypass arrow -->
  <path d="M24 12L27 9" stroke="#ff355e" stroke-width="1"/>
  <rect x="27" y="9" width="1" height="1" fill="#ff355e"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="7" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="26" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
