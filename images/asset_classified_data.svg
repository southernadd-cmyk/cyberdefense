<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Classified Data</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Document panel -->
  <rect x="7" y="8" width="18" height="18" fill="url(#paper)" stroke="#2a313c" stroke-width="1"/>

  <!-- Folded corner -->
  <path d="M22 8V11H25" stroke="#4d5969" stroke-width="1"/>

  <!-- Classified stamp band -->
  <rect x="8" y="12" width="16" height="3" fill="#1a0d12" stroke="#ff355e" stroke-width="1"/>
  <path d="M10 13.5H22" stroke="#ff355e" stroke-width="1"/>

  <!-- Data lines -->
  <path d="M10 17H21M10 19H20M10 21H18" stroke="#42f58d" stroke-width="1"/>

  <!-- Central lock (restricted/classified) -->
  <rect x="19" y="18" width="4" height="4" fill="#0a0d12" stroke="#57d9ff" stroke-width="1"/>
  <path d="M20 18V17C20 16 20.8 15 21 15C21.2 15 22 16 22 17V18" stroke="#57d9ff" stroke-width="1"/>

  <!-- Tiny corruption/glitch accents -->
  <rect x="8" y="24" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="23" y="10" width="1" height="1" fill="#57d9ff" fill-opacity="0.45"/>
</svg>
