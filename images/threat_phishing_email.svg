<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Phishing Email</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
    <linearGradient id="lure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57d9ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#42f58d" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Email client panel -->
  <rect x="6" y="8" width="20" height="18" fill="url(#panel)" stroke="#2a313c" stroke-width="1"/>

  <!-- Inbox rows -->
  <rect x="8" y="10" width="16" height="2" fill="#05070b" stroke="#242c35" stroke-width="1"/>
  <path d="M9 11H14M16 11H22" stroke="#57d9ff" stroke-width="1"/>
  <rect x="8" y="13" width="16" height="2" fill="#05070b" stroke="#242c35" stroke-width="1"/>
  <path d="M9 14H13M15 14H20" stroke="#42f58d" stroke-width="1"/>

  <!-- Suspicious email envelope -->
  <rect x="9" y="16" width="10" height="7" fill="#0a0d12" stroke="#57d9ff" stroke-width="1"/>
  <path d="M9 16L14 20L19 16" stroke="#57d9ff" stroke-width="1"/>
  <path d="M9 23L12 20M19 23L16 20" stroke="#57d9ff" stroke-width="1"/>
  <rect x="10" y="17" width="2" height="1" fill="#ff355e"/>

  <!-- Lure link window -->
  <rect x="20" y="16" width="5" height="4" fill="url(#lure)" stroke="#42f58d" stroke-width="1"/>
  <path d="M21 18H24" stroke="#42f58d" stroke-width="1"/>
  <rect x="23" y="17" width="1" height="1" fill="#ff355e"/>

  <!-- Hook (phishing lure) -->
  <path d="M23 11V15" stroke="#ff355e" stroke-width="1"/>
  <path d="M23 15H24V16H23" stroke="#ff355e" stroke-width="1"/>
  <path d="M22 12H24" stroke="#ff355e" stroke-width="1"/>

  <!-- Credential theft arrows -->
  <path d="M14 23V25H22" stroke="#ff355e" stroke-width="1"/>
  <path d="M22 24L24 25L22 26" stroke="#ff355e" stroke-width="1"/>

  <!-- Stolen-data node -->
  <rect x="24" y="24" width="3" height="3" fill="#11161d" stroke="#42f58d" stroke-width="1"/>
  <rect x="25" y="25" width="1" height="1" fill="#42f58d"/>

  <!-- Alert ticker -->
  <rect x="8" y="24" width="11" height="1" fill="#ff355e" fill-opacity="0.5"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="7" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="26" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
