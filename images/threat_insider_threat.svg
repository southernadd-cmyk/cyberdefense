<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Insider Threat</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Internal trusted zone -->
  <rect x="6" y="8" width="17" height="18" fill="url(#panel)" stroke="#2a313c" stroke-width="1"/>
  <path d="M7 11H22M7 15H22M7 19H22" stroke="#57d9ff" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Insider account card -->
  <rect x="9" y="10" width="9" height="12" fill="#0b0f14" stroke="#57d9ff" stroke-width="1"/>
  <rect x="12" y="12" width="3" height="2" fill="#42f58d"/>
  <rect x="11" y="15" width="5" height="2" fill="#42f58d"/>
  <path d="M10 19H17" stroke="#57d9ff" stroke-width="1"/>

  <!-- Hidden malicious mark inside trusted user -->
  <rect x="14" y="18" width="2" height="2" fill="#ff355e"/>
  <path d="M13 19H17M15 17V21" stroke="#ff355e" stroke-width="1"/>

  <!-- Exfiltration channel from inside to outside -->
  <path d="M18 16H24" stroke="#ff355e" stroke-width="1"/>
  <path d="M24 14L27 16L24 18" stroke="#ff355e" stroke-width="1"/>

  <!-- External receiver node -->
  <rect x="25" y="14" width="3" height="4" fill="#11161d" stroke="#42f58d" stroke-width="1"/>
  <rect x="26" y="15" width="1" height="1" fill="#42f58d"/>

  <!-- Warning strip -->
  <rect x="7" y="23" width="15" height="2" fill="#1a0d12" stroke="#ff355e" stroke-width="1"/>
  <path d="M8 24H12M14 24H20" stroke="#ff355e" stroke-width="1"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="7" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="26" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
