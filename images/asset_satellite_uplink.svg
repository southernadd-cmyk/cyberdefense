<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Satellite Uplink</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Ground station console -->
  <rect x="7" y="20" width="18" height="6" fill="url(#panel)" stroke="#2a313c" stroke-width="1"/>
  <path d="M9 22H15M9 24H13M17 22H23" stroke="#42f58d" stroke-width="1"/>

  <!-- Dish mast -->
  <rect x="15" y="16" width="2" height="4" fill="#0b0f14" stroke="#57d9ff" stroke-width="1"/>

  <!-- Satellite dish -->
  <path d="M10 15L19 11L21 13L12 17L10 15Z" fill="#0b0f14" stroke="#57d9ff" stroke-width="1"/>
  <rect x="19" y="11" width="2" height="2" fill="#11161d" stroke="#ff355e" stroke-width="1"/>

  <!-- Uplink beams -->
  <path d="M21 12L24 9M22 14L26 11M20 10L22 8" stroke="#42f58d" stroke-width="1"/>
  <rect x="24" y="9" width="1" height="1" fill="#42f58d"/>
  <rect x="26" y="11" width="1" height="1" fill="#57d9ff"/>
  <rect x="22" y="8" width="1" height="1" fill="#42f58d"/>

  <!-- Orbiting satellite icon -->
  <rect x="23" y="6" width="4" height="3" fill="#0a0d12" stroke="#57d9ff" stroke-width="1"/>
  <rect x="22" y="6" width="1" height="3" fill="#11161d" stroke="#57d9ff" stroke-width="1"/>
  <rect x="27" y="6" width="1" height="3" fill="#11161d" stroke="#57d9ff" stroke-width="1"/>
  <rect x="24" y="7" width="2" height="1" fill="#ff355e"/>

  <!-- Cable route -->
  <path d="M16 20V18H13" stroke="#57d9ff" stroke-width="1"/>

  <!-- Alert/status badge -->
  <rect x="23" y="23" width="4" height="3" fill="#11161d" stroke="#ff355e" stroke-width="1"/>
  <path d="M24 24H26" stroke="#ff355e" stroke-width="1"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="4" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="27" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
