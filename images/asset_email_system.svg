<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Email System</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="4" width="26" height="24" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="4" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="5" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="5" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="5" width="1" height="1" fill="#3cff9b"/>

  <!-- Email server panel -->
  <rect x="6" y="8" width="20" height="16" fill="url(#panel)" stroke="#2a313c" stroke-width="1"/>

  <!-- Envelope body -->
  <rect x="8" y="11" width="16" height="9" fill="#0a0d12" stroke="#57d9ff" stroke-width="1"/>
  <path d="M8 11L16 16L24 11" stroke="#57d9ff" stroke-width="1"/>
  <path d="M8 20L13 16M24 20L19 16" stroke="#57d9ff" stroke-width="1"/>

  <!-- Message lines -->
  <path d="M10 22H20M10 23H17" stroke="#42f58d" stroke-width="1"/>

  <!-- Inbound / outbound network nodes -->
  <rect x="5" y="14" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="25" y="14" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <path d="M7 15H8M24 15H25" stroke="#42f58d" stroke-width="1"/>

  <!-- Security filter badge -->
  <rect x="20" y="20" width="5" height="3" fill="#11161d" stroke="#ff355e" stroke-width="1"/>
  <path d="M21 20V19C21 18 21.8 17 22.5 17C23.2 17 24 18 24 19V20" stroke="#ff355e" stroke-width="1"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="9" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="23" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
