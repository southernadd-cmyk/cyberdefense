<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Intelligence Database</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Database cylinder top -->
  <ellipse cx="16" cy="9" rx="8" ry="2.5" fill="#0a0d12" stroke="#57d9ff" stroke-width="1"/>

  <!-- Database body -->
  <path d="M8 9V23C8 24.5 11.6 26 16 26C20.4 26 24 24.5 24 23V9" fill="url(#db)" stroke="#57d9ff" stroke-width="1"/>

  <!-- Data layers -->
  <path d="M8 14C8 15.5 11.6 17 16 17C20.4 17 24 15.5 24 14" stroke="#42f58d" stroke-width="1"/>
  <path d="M8 19C8 20.5 11.6 22 16 22C20.4 22 24 20.5 24 19" stroke="#42f58d" stroke-width="1"/>

  <!-- Intel pulse/scan indicator -->
  <rect x="14" y="12" width="4" height="4" fill="#0b0f14" stroke="#ff355e" stroke-width="1"/>
  <path d="M15 14H17" stroke="#ff355e" stroke-width="1"/>

  <!-- Side connection ports -->
  <rect x="5" y="15" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="25" y="15" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <path d="M7 16H8M24 16H25" stroke="#57d9ff" stroke-width="1"/>

  <!-- Subtle glitch accents -->
  <rect x="23" y="8" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="8" y="24" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
