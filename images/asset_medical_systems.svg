<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Medical Systems</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Medical systems core hex -->
  <path d="M16 7L22 10V22L16 25L10 22V10Z" fill="url(#panel)" stroke="#57d9ff" stroke-width="1"/>

  <!-- Medical cross -->
  <rect x="15" y="12" width="2" height="8" fill="#42f58d"/>
  <rect x="12" y="15" width="8" height="2" fill="#42f58d"/>

  <!-- ECG line -->
  <path d="M8 19H12L13 17L14 21L15 19H19L20 18L21 20H24" stroke="#ff355e" stroke-width="1"/>

  <!-- Left and right system nodes -->
  <rect x="5" y="13" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="25" y="13" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <path d="M7 14H10M22 14H25" stroke="#57d9ff" stroke-width="1"/>

  <!-- Secure care lock badge -->
  <rect x="19" y="22" width="5" height="3" fill="#11161d" stroke="#ff355e" stroke-width="1"/>
  <path d="M20 22V21C20 20 20.8 19 21.5 19C22.2 19 23 20 23 21V22" stroke="#ff355e" stroke-width="1"/>

  <!-- Subtle glitch accents -->
  <rect x="23" y="8" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="7" y="24" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
