<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>DDoS Attack</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Target server under attack -->
  <rect x="13" y="13" width="6" height="6" fill="url(#panel)" stroke="#57d9ff" stroke-width="1"/>
  <rect x="14" y="14" width="4" height="1" fill="#42f58d"/>
  <rect x="14" y="16" width="3" height="1" fill="#42f58d"/>
  <rect x="15" y="18" width="2" height="1" fill="#ff355e"/>

  <!-- Overload pulse ring -->
  <path d="M12 12H20V20H12Z" stroke="#ff355e" stroke-opacity="0.7" stroke-width="1"/>

  <!-- Flooding traffic nodes -->
  <rect x="6" y="9" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="15" y="8" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="24" y="9" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>

  <rect x="5" y="15" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="25" y="15" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>

  <rect x="6" y="23" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="15" y="24" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="24" y="23" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>

  <!-- Attack vectors converging on target -->
  <path d="M8 10L13 13M16 10L16 13M24 10L19 13" stroke="#ff355e" stroke-width="1"/>
  <path d="M7 16H13M25 16H19" stroke="#ff355e" stroke-width="1"/>
  <path d="M8 24L13 19M16 24L16 19M24 24L19 19" stroke="#ff355e" stroke-width="1"/>

  <!-- Packet indicators -->
  <rect x="10" y="12" width="1" height="1" fill="#57d9ff"/>
  <rect x="21" y="12" width="1" height="1" fill="#57d9ff"/>
  <rect x="10" y="20" width="1" height="1" fill="#57d9ff"/>
  <rect x="21" y="20" width="1" height="1" fill="#57d9ff"/>

  <!-- Alert marker -->
  <path d="M16 15V17" stroke="#ff355e" stroke-width="1"/>
  <rect x="16" y="18" width="1" height="1" fill="#ff355e"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="7" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="26" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
