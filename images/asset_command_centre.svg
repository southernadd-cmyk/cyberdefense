<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Command Centre</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Command centre core hex -->
  <path d="M16 8L23 12V20L16 24L9 20V12Z" fill="url(#core)" stroke="#57d9ff" stroke-width="1"/>

  <!-- Core monitor lines -->
  <path d="M12 14H20M12 16H19M13 18H18" stroke="#42f58d" stroke-width="1"/>

  <!-- Central command reticle -->
  <path d="M16 13V19M13 16H19" stroke="#57d9ff" stroke-width="1"/>
  <rect x="15" y="15" width="2" height="2" fill="#0a0d12" stroke="#ff355e" stroke-width="1"/>

  <!-- Satellite nodes -->
  <rect x="6" y="15" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="24" y="15" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="15" y="25" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>

  <!-- Control links -->
  <path d="M8 16H9M23 16H24M16 24V25" stroke="#57d9ff" stroke-width="1"/>

  <!-- Alert strip -->
  <rect x="11" y="22" width="10" height="1" fill="#ff355e" fill-opacity="0.45"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="10" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="7" y="23" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
