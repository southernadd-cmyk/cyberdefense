<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Defence Grid</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Defence grid field -->
  <rect x="6" y="8" width="20" height="18" fill="#0a0d12" stroke="#2a313c" stroke-width="1"/>

  <!-- Horizontal grid lines -->
  <path d="M7 12H25M7 16H25M7 20H25" stroke="#57d9ff" stroke-width="1" stroke-opacity="0.55"/>

  <!-- Vertical grid lines -->
  <path d="M10 9V25M14 9V25M18 9V25M22 9V25" stroke="#57d9ff" stroke-width="1" stroke-opacity="0.55"/>

  <!-- Central command/core node -->
  <rect x="14" y="14" width="4" height="4" fill="url(#core)" stroke="#ff355e" stroke-width="1"/>
  <rect x="15" y="15" width="2" height="2" fill="#42f58d"/>

  <!-- Perimeter defence nodes -->
  <rect x="8" y="10" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="22" y="10" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="8" y="22" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="22" y="22" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>

  <!-- Links from nodes to core -->
  <path d="M10 11H14M18 11H22M10 23H14M18 23H22" stroke="#42f58d" stroke-width="1" stroke-opacity="0.75"/>
  <path d="M16 12V14M16 18V22" stroke="#42f58d" stroke-width="1" stroke-opacity="0.75"/>

  <!-- Alert strip -->
  <rect x="12" y="25" width="8" height="1" fill="#ff355e" fill-opacity="0.45"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="8" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="24" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
