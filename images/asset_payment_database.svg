<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Payment Database</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Database cylinder -->
  <ellipse cx="16" cy="9" rx="7" ry="2.5" fill="#0a0d12" stroke="#57d9ff" stroke-width="1"/>
  <path d="M9 9V22C9 23.6 12.1 25 16 25C19.9 25 23 23.6 23 22V9" fill="url(#db)" stroke="#57d9ff" stroke-width="1"/>

  <!-- Data/payment layers -->
  <path d="M9 13.5C9 15.1 12.1 16.5 16 16.5C19.9 16.5 23 15.1 23 13.5" stroke="#42f58d" stroke-width="1"/>
  <path d="M9 18C9 19.6 12.1 21 16 21C19.9 21 23 19.6 23 18" stroke="#42f58d" stroke-width="1"/>

  <!-- Payment card badge -->
  <rect x="11" y="23" width="10" height="5" fill="#11161d" stroke="#ff355e" stroke-width="1"/>
  <rect x="12" y="24" width="8" height="1" fill="#ff355e" fill-opacity="0.55"/>
  <path d="M13 26H16M17 26H19" stroke="#57d9ff" stroke-width="1"/>

  <!-- Secure transaction lock -->
  <rect x="23" y="18" width="4" height="4" fill="#0b0f14" stroke="#ff355e" stroke-width="1"/>
  <path d="M24 18V17C24 16 24.8 15 25 15C25.2 15 26 16 26 17V18" stroke="#ff355e" stroke-width="1"/>

  <!-- Side network ports -->
  <rect x="5" y="14" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="25" y="12" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <path d="M7 15H9M23 13H25" stroke="#57d9ff" stroke-width="1"/>

  <!-- Subtle glitch accents -->
  <rect x="23" y="8" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="8" y="24" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
