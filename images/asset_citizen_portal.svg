<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Citizen Portal</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="4" width="26" height="24" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="4" width="26" height="3" fill="#10141b"/>

  <!-- Header status lights -->
  <rect x="5" y="5" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="5" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="5" width="1" height="1" fill="#3cff9b"/>

  <!-- Portal window -->
  <rect x="6" y="8" width="20" height="16" fill="url(#panel)" stroke="#2a313c" stroke-width="1"/>

  <!-- User avatar badge (citizen account) -->
  <rect x="8" y="10" width="7" height="7" fill="#0b0f14" stroke="#57d9ff" stroke-width="1"/>
  <rect x="10" y="11" width="3" height="2" fill="#42f58d"/>
  <rect x="9" y="14" width="5" height="2" fill="#42f58d"/>

  <!-- Form lines / portal content -->
  <path d="M17 11H24M17 13H23M17 15H22" stroke="#42f58d" stroke-width="1"/>

  <!-- Login / access strip -->
  <rect x="8" y="19" width="16" height="3" fill="#0a0d12" stroke="#ff355e" stroke-width="1"/>
  <path d="M10 20.5H14M16 20.5H22" stroke="#57d9ff" stroke-width="1"/>

  <!-- Cursor + tiny glitch accents -->
  <rect x="23" y="13" width="1" height="1" fill="#42f58d"/>
  <rect x="24" y="9" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="23" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
