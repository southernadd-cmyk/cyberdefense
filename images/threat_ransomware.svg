<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Ransomware</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff355e" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff355e" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Infected system panel -->
  <rect x="6" y="8" width="20" height="18" fill="url(#panel)" stroke="#2a313c" stroke-width="1"/>

  <!-- Encrypted files block -->
  <rect x="8" y="10" width="7" height="5" fill="#0a0d12" stroke="#57d9ff" stroke-width="1"/>
  <rect x="17" y="10" width="7" height="5" fill="#0a0d12" stroke="#57d9ff" stroke-width="1"/>
  <path d="M9 12H13M18 12H22" stroke="#42f58d" stroke-width="1"/>

  <!-- Lock overlay (files locked) -->
  <rect x="13" y="14" width="6" height="6" fill="#11161d" stroke="#ff355e" stroke-width="1"/>
  <path d="M14 14V13C14 12 14.8 11 16 11C17.2 11 18 12 18 13V14" stroke="#ff355e" stroke-width="1"/>
  <rect x="15" y="16" width="2" height="2" fill="#ff355e"/>

  <!-- Ransom note window -->
  <rect x="8" y="18" width="10" height="6" fill="url(#warn)" stroke="#ff355e" stroke-width="1"/>
  <path d="M9 20H16M9 22H14" stroke="#ff355e" stroke-width="1"/>
  <path d="M16 19L17 20L16 21" stroke="#ff355e" stroke-width="1"/>

  <!-- Countdown/urgency badge -->
  <rect x="19" y="18" width="5" height="4" fill="#0b0f14" stroke="#57d9ff" stroke-width="1"/>
  <path d="M20 20H23" stroke="#57d9ff" stroke-width="1"/>
  <rect x="21" y="19" width="1" height="1" fill="#ff355e"/>

  <!-- Exfil/payment arrow -->
  <path d="M18 24H23" stroke="#ff355e" stroke-width="1"/>
  <path d="M23 23L25 24L23 25" stroke="#ff355e" stroke-width="1"/>

  <!-- Crypto/payment node -->
  <rect x="25" y="23" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="25" y="26" width="2" height="1" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>

  <!-- Corruption/glitch marks -->
  <rect x="24" y="7" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="26" width="2" height="1" fill="#57d9ff" fill-opacity="0.40"/>
</svg>
