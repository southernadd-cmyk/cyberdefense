<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>ATM Network</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="atm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Backplate -->
  <rect x="3" y="4" width="26" height="24" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="4" width="26" height="3" fill="#10141b"/>

  <!-- Header indicator lights -->
  <rect x="5" y="5" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="5" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="5" width="1" height="1" fill="#3cff9b"/>

  <!-- ATM unit -->
  <rect x="10" y="8" width="12" height="16" fill="url(#atm)" stroke="#4a5565" stroke-width="1"/>
  <rect x="12" y="10" width="8" height="4" fill="#05070b" stroke="#2a313c" stroke-width="1"/>
  <path d="M13 12H19" stroke="#42f58d" stroke-width="1"/>
  <path d="M12 16H20M12 18H18" stroke="#57d9ff" stroke-width="1"/>
  <rect x="13" y="20" width="6" height="2" fill="#11161d" stroke="#ff355e" stroke-width="1"/>

  <!-- Network nodes -->
  <rect x="5" y="14" width="3" height="3" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="24" y="14" width="3" height="3" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>

  <!-- Network links -->
  <path d="M8 15.5H10" stroke="#57d9ff" stroke-width="1"/>
  <path d="M22 15.5H24" stroke="#57d9ff" stroke-width="1"/>
  <rect x="9" y="15" width="1" height="1" fill="#42f58d"/>
  <rect x="22" y="15" width="1" height="1" fill="#42f58d"/>

  <!-- Ground base -->
  <rect x="9" y="25" width="14" height="2" fill="#0f141b" stroke="#3b4350" stroke-width="1"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="9" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="22" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
