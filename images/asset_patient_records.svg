<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Patient Records</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Patient file folder -->
  <path d="M6 10H12L13 9H22V25H6V10Z" fill="url(#panel)" stroke="#57d9ff" stroke-width="1"/>

  <!-- Record lines -->
  <path d="M8 13H17M8 15H16M8 17H15M8 19H14" stroke="#42f58d" stroke-width="1"/>

  <!-- Patient ID card badge -->
  <rect x="15" y="12" width="6" height="7" fill="#0a0d12" stroke="#2a313c" stroke-width="1"/>
  <rect x="17" y="13" width="2" height="2" fill="#42f58d"/>
  <rect x="16" y="16" width="4" height="1" fill="#57d9ff"/>
  <rect x="16" y="17" width="3" height="1" fill="#57d9ff"/>

  <!-- Medical cross marker -->
  <rect x="18" y="21" width="2" height="4" fill="#42f58d"/>
  <rect x="17" y="22" width="4" height="2" fill="#42f58d"/>

  <!-- Confidential lock -->
  <rect x="23" y="20" width="4" height="4" fill="#11161d" stroke="#ff355e" stroke-width="1"/>
  <path d="M24 20V19C24 18 24.8 17 25 17C25.2 17 26 18 26 19V20" stroke="#ff355e" stroke-width="1"/>

  <!-- Linking pulse -->
  <path d="M21 14H23M21 22H23" stroke="#57d9ff" stroke-width="1"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="8" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="24" width="2" height="1" fill="#57d9ff" fill-opacity="0.40"/>
</svg>
