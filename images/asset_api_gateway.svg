<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>API Gateway</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171d27"/>
      <stop offset="1" stop-color="#0d1118"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" rx="1" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Window lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Gateway core panel -->
  <rect x="7" y="8" width="18" height="17" fill="url(#panel)" stroke="#2a313c" stroke-width="1"/>

  <!-- Left inbound node -->
  <path d="M9 16L14 12V20L9 16Z" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>

  <!-- Right outbound node -->
  <path d="M23 16L18 12V20L23 16Z" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>

  <!-- API gateway spine -->
  <path d="M16 10V22" stroke="#57d9ff" stroke-width="1"/>
  <path d="M14 16H18" stroke="#57d9ff" stroke-width="1"/>

  <!-- Data flow packets -->
  <rect x="12" y="15" width="1" height="1" fill="#42f58d"/>
  <rect x="19" y="15" width="1" height="1" fill="#42f58d"/>

  <!-- Auth/rate-limit shield badge -->
  <path d="M15 23H17L18 24V26L16 27L14 26V24L15 23Z" fill="#11161d" stroke="#ff355e" stroke-width="1"/>

  <!-- Subtle glitch accents -->
  <rect x="21" y="9" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="8" y="23" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
  <rect x="24" y="18" width="1" height="1" fill="#ff355e" fill-opacity="0.35"/>
</svg>
