<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Customer VMs</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Customer profile node -->
  <rect x="6" y="9" width="7" height="8" fill="#0b0f14" stroke="#57d9ff" stroke-width="1"/>
  <rect x="8" y="10" width="3" height="2" fill="#42f58d"/>
  <rect x="7" y="13" width="5" height="2" fill="#42f58d"/>

  <!-- VM cluster container -->
  <rect x="14" y="8" width="12" height="15" fill="url(#panel)" stroke="#2a313c" stroke-width="1"/>

  <!-- VM tiles -->
  <rect x="15" y="10" width="4" height="4" fill="#0a0d12" stroke="#42f58d" stroke-width="1"/>
  <rect x="20" y="10" width="5" height="4" fill="#0a0d12" stroke="#42f58d" stroke-width="1"/>
  <rect x="15" y="15" width="5" height="4" fill="#0a0d12" stroke="#42f58d" stroke-width="1"/>
  <rect x="21" y="15" width="4" height="4" fill="#0a0d12" stroke="#42f58d" stroke-width="1"/>

  <!-- Tiny terminal lines in VMs -->
  <path d="M16 12H18M21 12H24M16 17H19M22 17H24" stroke="#57d9ff" stroke-width="1"/>

  <!-- Link line from customer to VM cluster -->
  <path d="M13 13H14" stroke="#57d9ff" stroke-width="1"/>
  <rect x="13" y="13" width="1" height="1" fill="#42f58d"/>

  <!-- Access-control lock badge -->
  <rect x="9" y="20" width="6" height="4" fill="#11161d" stroke="#ff355e" stroke-width="1"/>
  <path d="M10 20V19C10 18 10.8 17 12 17C13.2 17 14 18 14 19V20" stroke="#ff355e" stroke-width="1"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="7" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="25" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
  <rect x="22" y="22" width="2" height="1" fill="#ff355e" fill-opacity="0.3"/>
</svg>
