<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Monitoring System</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="4" width="26" height="24" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="4" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="5" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="5" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="5" width="1" height="1" fill="#3cff9b"/>

  <!-- Monitor body -->
  <rect x="6" y="9" width="20" height="12" fill="url(#panel)" stroke="#2a313c" stroke-width="1"/>
  <rect x="7" y="10" width="18" height="8" fill="#05070b" stroke="#242c35" stroke-width="1"/>

  <!-- Live telemetry graph -->
  <path d="M8 16H10L11 13L12 17L13 15H15L16 12L17 18L18 15H21L22 14H24" stroke="#42f58d" stroke-width="1"/>
  <path d="M8 12H13M8 14H11" stroke="#57d9ff" stroke-width="1" stroke-opacity="0.75"/>

  <!-- Scan reticle + hot spot -->
  <path d="M20 11V17" stroke="#57d9ff" stroke-width="1" stroke-opacity="0.6"/>
  <rect x="20" y="13" width="1" height="1" fill="#ff355e"/>

  <!-- Mini magnifier (monitoring/inspection) -->
  <rect x="21" y="16" width="3" height="3" fill="#0b0f14" stroke="#57d9ff" stroke-width="1"/>
  <path d="M24 19L25 20" stroke="#57d9ff" stroke-width="1"/>

  <!-- Stand -->
  <path d="M12 22H20L22 27H10L12 22Z" fill="#0f141b" stroke="#3b4350" stroke-width="1"/>
  <path d="M13 24H19" stroke="#42f58d" stroke-width="1"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="8" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="20" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
