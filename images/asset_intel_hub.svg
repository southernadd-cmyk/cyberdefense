<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Intel Hub</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Intel hub core (pixel-circle style) -->
  <rect x="10" y="10" width="12" height="12" fill="url(#hub)" stroke="#57d9ff" stroke-width="1"/>
  <rect x="9" y="13" width="1" height="6" fill="url(#hub)" stroke="#57d9ff" stroke-width="1"/>
  <rect x="22" y="13" width="1" height="6" fill="url(#hub)" stroke="#57d9ff" stroke-width="1"/>
  <rect x="13" y="9" width="6" height="1" fill="url(#hub)" stroke="#57d9ff" stroke-width="1"/>
  <rect x="13" y="22" width="6" height="1" fill="url(#hub)" stroke="#57d9ff" stroke-width="1"/>

  <!-- Crosshair/intelligence marker -->
  <path d="M16 12V20M12 16H20" stroke="#42f58d" stroke-width="1"/>
  <rect x="15" y="15" width="2" height="2" fill="#0a0d12" stroke="#ff355e" stroke-width="1"/>

  <!-- Data spokes -->
  <path d="M6 16H9M23 16H26M16 6V9M16 23V26" stroke="#57d9ff" stroke-width="1"/>

  <!-- Satellite intel nodes -->
  <rect x="5" y="15" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="25" y="15" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="15" y="5" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="15" y="25" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>

  <!-- Signal pips -->
  <rect x="8" y="16" width="1" height="1" fill="#42f58d"/>
  <rect x="23" y="16" width="1" height="1" fill="#42f58d"/>
  <rect x="16" y="8" width="1" height="1" fill="#42f58d"/>
  <rect x="16" y="23" width="1" height="1" fill="#42f58d"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="8" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="24" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
