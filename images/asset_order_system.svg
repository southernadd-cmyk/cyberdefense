<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Order System</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Order route / pipeline at top -->
  <path d="M6 9H13L17 6H26V12H17L13 9" fill="#0b0f14" stroke="#57d9ff" stroke-width="1"/>
  <path d="M8 10H12M18 8H24" stroke="#42f58d" stroke-width="1"/>
  <rect x="24" y="8" width="1" height="1" fill="#ff355e"/>

  <!-- Main order list panel -->
  <rect x="6" y="16" width="20" height="11" fill="url(#panel)" stroke="#2a313c" stroke-width="1"/>

  <!-- Order lines / queue rows -->
  <path d="M9 19H23M9 21H21M9 23H19" stroke="#42f58d" stroke-width="1"/>

  <!-- Status ticks -->
  <path d="M21 19L22 20L24 18" stroke="#57d9ff" stroke-width="1"/>
  <path d="M19 23L20 24L22 22" stroke="#57d9ff" stroke-width="1"/>

  <!-- Priority badge -->
  <rect x="7" y="24" width="5" height="2" fill="#1a0d12" stroke="#ff355e" stroke-width="1"/>
  <path d="M8 25H11" stroke="#ff355e" stroke-width="1"/>

  <!-- subtle glitch accents -->
  <rect x="24" y="14" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="27" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
