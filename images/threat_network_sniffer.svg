<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Network Sniffer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57d9ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#42f58d" stop-opacity="0.20"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Network space -->
  <rect x="6" y="8" width="20" height="18" fill="url(#panel)" stroke="#2a313c" stroke-width="1"/>

  <!-- Network nodes -->
  <rect x="8" y="10" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="15" y="10" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="22" y="10" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>

  <rect x="8" y="16" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="15" y="16" width="2" height="2" fill="#0b0f14" stroke="#ff355e" stroke-width="1"/>
  <rect x="22" y="16" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>

  <rect x="8" y="22" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="15" y="22" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="22" y="22" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>

  <!-- Network links -->
  <path d="M10 11H15M17 11H22M10 17H15M17 17H22M10 23H15M17 23H22" stroke="#57d9ff" stroke-width="1" stroke-opacity="0.75"/>
  <path d="M9 12V16M9 18V22M16 12V16M16 18V22M23 12V16M23 18V22" stroke="#57d9ff" stroke-width="1" stroke-opacity="0.55"/>

  <!-- Sniffer lens -->
  <rect x="13" y="14" width="6" height="6" fill="url(#scan)" stroke="#57d9ff" stroke-width="1"/>
  <rect x="15" y="16" width="2" height="2" fill="#ff355e"/>

  <!-- Lens handle -->
  <path d="M19 20L22 23" stroke="#57d9ff" stroke-width="1"/>
  <rect x="22" y="23" width="2" height="1" fill="#57d9ff"/>

  <!-- Packet capture wave -->
  <path d="M12 14H11M20 14H21M12 20H11M20 20H21" stroke="#42f58d" stroke-width="1"/>
  <path d="M14 13H18M14 21H18" stroke="#42f58d" stroke-width="1" stroke-opacity="0.8"/>

  <!-- Captured packet bar -->
  <rect x="7" y="25" width="18" height="1" fill="#ff355e" fill-opacity="0.5"/>
  <rect x="12" y="25" width="3" height="1" fill="#57d9ff"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="7" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="26" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
