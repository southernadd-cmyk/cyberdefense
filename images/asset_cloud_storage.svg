<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Cloud Storage</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="4" width="26" height="24" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="4" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="5" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="5" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="5" width="1" height="1" fill="#3cff9b"/>

  <!-- Cloud body -->
  <rect x="7" y="12" width="18" height="8" fill="url(#panel)" stroke="#57d9ff" stroke-width="1"/>
  <rect x="10" y="10" width="4" height="3" fill="url(#panel)" stroke="#57d9ff" stroke-width="1"/>
  <rect x="14" y="9" width="5" height="4" fill="url(#panel)" stroke="#57d9ff" stroke-width="1"/>
  <rect x="19" y="10" width="4" height="3" fill="url(#panel)" stroke="#57d9ff" stroke-width="1"/>

  <!-- Data/storage tray -->
  <rect x="10" y="21" width="12" height="4" fill="#0a0d12" stroke="#42f58d" stroke-width="1"/>
  <path d="M12 23H20" stroke="#42f58d" stroke-width="1"/>

  <!-- Sync arrows -->
  <path d="M12 16H10V14" stroke="#42f58d" stroke-width="1"/>
  <path d="M20 16H22V18" stroke="#42f58d" stroke-width="1"/>
  <rect x="10" y="14" width="1" height="1" fill="#42f58d"/>
  <rect x="22" y="18" width="1" height="1" fill="#42f58d"/>

  <!-- Tiny glitch accents -->
  <rect x="23" y="11" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="7" y="24" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
