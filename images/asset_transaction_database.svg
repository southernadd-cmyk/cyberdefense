<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Transaction Database</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57d9ff"/>
      <stop offset="1" stop-color="#42f58d"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Database cylinder -->
  <ellipse cx="16" cy="10" rx="7" ry="2.5" fill="#0a0d12" stroke="#57d9ff" stroke-width="1"/>
  <path d="M9 10V21C9 22.8 12.1 24 16 24C19.9 24 23 22.8 23 21V10" fill="url(#db)" stroke="#57d9ff" stroke-width="1"/>

  <!-- Data layers -->
  <path d="M9 14C9 15.8 12.1 17 16 17C19.9 17 23 15.8 23 14" stroke="#42f58d" stroke-width="1"/>
  <path d="M9 18C9 19.8 12.1 21 16 21C19.9 21 23 19.8 23 18" stroke="#42f58d" stroke-width="1"/>

  <!-- Transaction arrows -->
  <path d="M8 11H5V9" stroke="url(#flow)" stroke-width="1"/>
  <rect x="5" y="9" width="1" height="1" fill="#42f58d"/>
  <path d="M24 19H27V21" stroke="url(#flow)" stroke-width="1"/>
  <rect x="27" y="21" width="1" height="1" fill="#57d9ff"/>

  <!-- Inbound/outbound nodes -->
  <rect x="4" y="8" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="26" y="20" width="2" height="2" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>

  <!-- Ledger panel -->
  <rect x="11" y="24" width="10" height="4" fill="#11161d" stroke="#2a313c" stroke-width="1"/>
  <path d="M12 25H19M12 26H17" stroke="#57d9ff" stroke-width="1"/>

  <!-- Secure transaction lock -->
  <rect x="21" y="24" width="5" height="4" fill="#11161d" stroke="#ff355e" stroke-width="1"/>
  <path d="M22 24V23C22 22 22.8 21 23.5 21C24.2 21 25 22 25 23V24" stroke="#ff355e" stroke-width="1"/>

  <!-- Verification tick -->
  <path d="M14 12L15 13L17 11" stroke="#ff355e" stroke-width="1"/>

  <!-- Subtle glitch accents -->
  <rect x="23" y="7" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="7" y="25" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
