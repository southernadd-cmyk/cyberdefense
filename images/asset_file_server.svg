<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>File Server</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Server rack bays -->
  <rect x="6" y="8" width="20" height="5" fill="url(#rack)" stroke="#2a313c" stroke-width="1"/>
  <rect x="6" y="14" width="20" height="5" fill="url(#rack)" stroke="#2a313c" stroke-width="1"/>
  <rect x="6" y="20" width="20" height="5" fill="url(#rack)" stroke="#2a313c" stroke-width="1"/>

  <!-- Bay indicators and status lines -->
  <rect x="8" y="10" width="1" height="1" fill="#42f58d"/>
  <path d="M10 10H17" stroke="#57d9ff" stroke-width="1"/>
  <rect x="23" y="10" width="1" height="1" fill="#ff355e" fill-opacity="0.8"/>

  <rect x="8" y="16" width="1" height="1" fill="#42f58d"/>
  <path d="M10 16H19" stroke="#57d9ff" stroke-width="1"/>
  <rect x="23" y="16" width="1" height="1" fill="#42f58d"/>

  <rect x="8" y="22" width="1" height="1" fill="#ff9f1c"/>
  <path d="M10 22H16" stroke="#57d9ff" stroke-width="1"/>
  <rect x="23" y="22" width="1" height="1" fill="#42f58d"/>

  <!-- Vertical bus/cable line -->
  <path d="M21 9V24" stroke="#42f58d" stroke-width="1" stroke-opacity="0.65"/>

  <!-- Tiny lock badge for secured file storage -->
  <rect x="18" y="25" width="6" height="3" fill="#11161d" stroke="#ff355e" stroke-width="1"/>
  <path d="M19 25V24C19 23 19.8 22 21 22C22.2 22 23 23 23 24V25" stroke="#ff355e" stroke-width="1"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="7" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="26" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
