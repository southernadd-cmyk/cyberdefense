<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Trading Platform</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
    <linearGradient id="chartGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57d9ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#42f58d" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Trading dashboard panel -->
  <rect x="6" y="8" width="20" height="17" fill="url(#panel)" stroke="#2a313c" stroke-width="1"/>

  <!-- Main chart window -->
  <rect x="7" y="9" width="12" height="9" fill="#05070b" stroke="#242c35" stroke-width="1"/>
  <rect x="7" y="9" width="12" height="9" fill="url(#chartGlow)"/>

  <!-- Grid -->
  <path d="M8 12H18M8 15H18M10 10V17M13 10V17M16 10V17" stroke="#57d9ff" stroke-opacity="0.45" stroke-width="1"/>

  <!-- Price line -->
  <path d="M8 16L10 14L11 15L13 12L15 13L18 10" stroke="#42f58d" stroke-width="1"/>
  <rect x="18" y="10" width="1" height="1" fill="#42f58d"/>

  <!-- Candles -->
  <rect x="20" y="10" width="1" height="3" fill="#42f58d"/>
  <rect x="22" y="11" width="1" height="4" fill="#ff355e"/>
  <rect x="24" y="9" width="1" height="5" fill="#42f58d"/>

  <!-- Order book rows -->
  <rect x="20" y="16" width="5" height="1" fill="#57d9ff"/>
  <rect x="20" y="18" width="4" height="1" fill="#42f58d"/>
  <rect x="20" y="20" width="3" height="1" fill="#ff355e"/>

  <!-- Buy / Sell buttons -->
  <rect x="7" y="20" width="5" height="3" fill="#0b0f14" stroke="#42f58d" stroke-width="1"/>
  <rect x="13" y="20" width="5" height="3" fill="#0b0f14" stroke="#ff355e" stroke-width="1"/>
  <path d="M8 21.5H11M14 21.5H17" stroke="#57d9ff" stroke-width="1"/>

  <!-- Secure transaction badge -->
  <rect x="22" y="23" width="4" height="3" fill="#11161d" stroke="#ff355e" stroke-width="1"/>
  <path d="M23 23V22C23 21 23.8 20 24 20C24.2 20 25 21 25 22V23" stroke="#ff355e" stroke-width="1"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="7" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="26" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
