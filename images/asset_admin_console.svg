<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Admin Console</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171b22"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f28"/>
      <stop offset="1" stop-color="#0e1218"/>
    </linearGradient>
  </defs>

  <!-- Main console frame -->
  <rect x="3" y="3" width="26" height="18" fill="url(#panel)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#11151b"/>

  <!-- Top bar indicators -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Terminal viewport -->
  <rect x="6" y="8" width="20" height="10" fill="#05070b" stroke="#242c35" stroke-width="1"/>

  <!-- Command lines -->
  <path d="M8 10H17M8 12H14M8 14H18M8 16H13" stroke="#42f58d" stroke-width="1"/>
  <path d="M19 14L20 15L22 13" stroke="#ff355e" stroke-width="1"/>

  <!-- Prompt cursor -->
  <path d="M19 16H23" stroke="#42f58d" stroke-width="1"/>
  <rect x="24" y="16" width="1" height="1" fill="#42f58d"/>

  <!-- Admin credential lock badge -->
  <rect x="22" y="18" width="5" height="3" fill="#11161d" stroke="#ff355e" stroke-width="1"/>
  <path d="M23 18V17C23 15.9 23.9 15 25 15C26.1 15 27 15.9 27 17V18" stroke="#ff355e" stroke-width="1"/>

  <!-- Console stand/panel -->
  <rect x="9" y="22" width="14" height="6" fill="url(#desk)" stroke="#3b4350" stroke-width="1"/>
  <path d="M11 24H21M11 26H18" stroke="#42f58d" stroke-width="1"/>

  <!-- Subtle glitch accents -->
  <rect x="5" y="19" width="3" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="20" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
  <rect x="24" y="7" width="2" height="1" fill="#ff355e" fill-opacity="0.35"/>
</svg>
