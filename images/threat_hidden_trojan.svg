<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Hidden Trojan</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="fileBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
    <linearGradient id="payload" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57d9ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#42f58d" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Disguised executable file -->
  <path d="M8 8H19L23 12V24H8V8Z" fill="url(#fileBody)" stroke="#57d9ff" stroke-width="1"/>
  <path d="M19 8V12H23" stroke="#57d9ff" stroke-width="1"/>

  <!-- Fake safe app lines -->
  <path d="M10 12H17M10 14H18M10 16H16" stroke="#42f58d" stroke-width="1"/>

  <!-- .EXE strip (disguise) -->
  <rect x="10" y="18" width="9" height="3" fill="#0a0d12" stroke="#2a313c" stroke-width="1"/>
  <path d="M11 19.5H18" stroke="#57d9ff" stroke-width="1"/>
  <rect x="18" y="19" width="2" height="2" fill="#42f58d"/>

  <!-- Hidden payload chamber -->
  <rect x="12" y="21" width="9" height="3" fill="url(#payload)" stroke="#ff355e" stroke-width="1"/>

  <!-- Trojan bug icon hidden inside -->
  <rect x="15" y="21" width="2" height="1" fill="#ff355e"/>
  <rect x="14" y="22" width="1" height="1" fill="#ff355e"/>
  <rect x="17" y="22" width="1" height="1" fill="#ff355e"/>
  <rect x="15" y="23" width="2" height="1" fill="#ff355e"/>

  <!-- Infiltration arrow -->
  <path d="M24 10L27 13L24 16" stroke="#ff355e" stroke-width="1"/>
  <path d="M27 13H22" stroke="#ff355e" stroke-width="1"/>
  <rect x="22" y="13" width="1" height="1" fill="#42f58d"/>

  <!-- Suspicious mask/shadow badge -->
  <rect x="24" y="20" width="4" height="4" fill="#11161d" stroke="#ff355e" stroke-width="1"/>
  <rect x="25" y="21" width="1" height="1" fill="#57d9ff"/>
  <rect x="26" y="21" width="1" height="1" fill="#57d9ff"/>
  <path d="M25 23H27" stroke="#ff355e" stroke-width="1"/>

  <!-- Alert pulse -->
  <path d="M7 26H15M16 26H22" stroke="#ff355e" stroke-width="1" stroke-opacity="0.55"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="7" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="24" width="2" height="1" fill="#57d9ff" fill-opacity="0.40"/>
</svg>
