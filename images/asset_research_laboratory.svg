<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Research Laboratory</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="labPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57d9ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#42f58d" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Lab room panel -->
  <rect x="6" y="8" width="20" height="18" fill="url(#labPanel)" stroke="#2a313c" stroke-width="1"/>

  <!-- Monitor/data strip -->
  <rect x="8" y="10" width="16" height="4" fill="#05070b" stroke="#242c35" stroke-width="1"/>
  <path d="M9 12H12L13 11L14 13L15 12H18L19 11L20 13H23" stroke="#42f58d" stroke-width="1"/>

  <!-- Flask (research) -->
  <path d="M11 16V18L9 22V24H15V22L13 18V16" fill="url(#glass)" stroke="#57d9ff" stroke-width="1"/>
  <path d="M10 22H14M10 23H14" stroke="#42f58d" stroke-width="1"/>
  <rect x="11" y="15" width="2" height="1" fill="#0b0f14" stroke="#57d9ff" stroke-width="1"/>

  <!-- Microscope silhouette -->
  <path d="M18 23H24M21 14H23V16H22V18H20V17H19V15H20V14H21Z" fill="#0b0f14" stroke="#57d9ff" stroke-width="1"/>
  <rect x="20" y="19" width="4" height="2" fill="#0b0f14" stroke="#57d9ff" stroke-width="1"/>
  <rect x="19" y="21" width="6" height="1" fill="#42f58d"/>

  <!-- Hazard/security badge -->
  <rect x="22" y="24" width="4" height="3" fill="#11161d" stroke="#ff355e" stroke-width="1"/>
  <path d="M23 25H25M24 24V26" stroke="#ff355e" stroke-width="1"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="9" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="25" width="2" height="1" fill="#57d9ff" fill-opacity="0.4"/>
</svg>
