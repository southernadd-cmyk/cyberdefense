<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <title>Staff Systems</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c11"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a202a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
  </defs>

  <!-- Outer frame -->
  <rect x="3" y="3" width="26" height="26" fill="url(#bg)" stroke="#3b4350" stroke-width="1"/>
  <rect x="3" y="3" width="26" height="3" fill="#10141b"/>

  <!-- Header lights -->
  <rect x="5" y="4" width="1" height="1" fill="#ff355e"/>
  <rect x="7" y="4" width="1" height="1" fill="#ff9f1c"/>
  <rect x="9" y="4" width="1" height="1" fill="#3cff9b"/>

  <!-- Staff terminal panel -->
  <rect x="7" y="8" width="18" height="8" fill="url(#panel)" stroke="#2a313c" stroke-width="1"/>
  <rect x="8" y="9" width="16" height="6" fill="#05070b" stroke="#242c35" stroke-width="1"/>
  <path d="M10 11H17M10 13H16" stroke="#42f58d" stroke-width="1"/>
  <rect x="20" y="10" width="3" height="3" fill="#0b0f14" stroke="#57d9ff" stroke-width="1"/>
  <path d="M21 11H22" stroke="#57d9ff" stroke-width="1"/>

  <!-- Staff records/system block -->
  <rect x="7" y="18" width="18" height="8" fill="url(#panel)" stroke="#2a313c" stroke-width="1"/>

  <!-- Staff avatars -->
  <rect x="9" y="20" width="3" height="2" fill="#42f58d"/>
  <rect x="8" y="22" width="5" height="2" fill="#42f58d"/>

  <rect x="15" y="20" width="3" height="2" fill="#57d9ff"/>
  <rect x="14" y="22" width="5" height="2" fill="#57d9ff"/>

  <!-- Access level / lock badge -->
  <rect x="20" y="20" width="4" height="4" fill="#11161d" stroke="#ff355e" stroke-width="1"/>
  <path d="M21 20V19C21 18 21.8 17 22 17C22.2 17 23 18 23 19V20" stroke="#ff355e" stroke-width="1"/>

  <!-- Network link between panels -->
  <path d="M16 16V18" stroke="#57d9ff" stroke-width="1"/>
  <rect x="16" y="17" width="1" height="1" fill="#42f58d"/>

  <!-- Subtle glitch accents -->
  <rect x="24" y="7" width="2" height="1" fill="#ff355e" fill-opacity="0.45"/>
  <rect x="6" y="26" width="2" height="1" fill="#57d9ff" fill-opacity="0.40"/>
</svg>
